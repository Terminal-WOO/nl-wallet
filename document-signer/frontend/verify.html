<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Verificatie - NL Wallet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .verification-result {
            display: none;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .verification-result.show {
            display: block;
        }

        .verification-result.verified {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .verification-result.failed {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .verification-result.loading {
            background: #d1ecf1;
            border: 2px solid #17a2b8;
        }

        .result-icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 15px;
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 15px;
        }

        .result-title.success {
            color: #155724;
        }

        .result-title.error {
            color: #721c24;
        }

        .result-title.info {
            color: #0c5460;
        }

        .details {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .detail-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #495057;
            width: 160px;
            flex-shrink: 0;
        }

        .detail-value {
            color: #212529;
            word-break: break-all;
        }

        .qr-scanner-area {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-top: 20px;
        }

        .manual-input {
            margin-top: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .hash-display {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            word-break: break-all;
            margin-top: 10px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>🔍 Document Verificatie</h1>
                <p>Controleer de geldigheid van een ondertekend document</p>
            </div>

            <div id="verificationResult" class="verification-result">
                <div class="result-icon" id="resultIcon"></div>
                <div class="result-title" id="resultTitle"></div>
                <div id="resultDetails"></div>
            </div>

            <div class="manual-input">
                <label style="display: block; margin-bottom: 10px; font-weight: 600; color: #333;">
                    Document ID:
                </label>
                <div class="input-group">
                    <input
                        type="text"
                        id="documentIdInput"
                        placeholder="Voer document ID in of scan QR code"
                    >
                    <button class="btn" id="verifyButton">Verifieer</button>
                </div>
            </div>

            <div class="qr-scanner-area">
                <p style="color: #666; margin-bottom: 10px;">
                    Of scan een verificatie QR code
                </p>
                <button class="btn btn-secondary" id="scanQrButton" style="background: #6c757d;">
                    📷 Scan QR Code
                </button>
            </div>
        </div>
    </div>

    <script>
        const verificationResult = document.getElementById('verificationResult');
        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');
        const resultDetails = document.getElementById('resultDetails');
        const documentIdInput = document.getElementById('documentIdInput');
        const verifyButton = document.getElementById('verifyButton');

        // Check if document ID is in URL
        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id') || urlParams.get('doc');

        if (docId) {
            documentIdInput.value = docId;
            verifyDocument(docId);
        }

        verifyButton.addEventListener('click', () => {
            const id = documentIdInput.value.trim();
            if (id) {
                verifyDocument(id);
            }
        });

        documentIdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                verifyButton.click();
            }
        });

        async function verifyDocument(documentId) {
            showLoading();

            try {
                const response = await fetch(`http://localhost:3001/api/documents/verify/${documentId}`);
                const data = await response.json();

                if (data.verified) {
                    showVerified(data);
                } else {
                    showFailed(data.error || 'Document kon niet worden geverifieerd');
                }
            } catch (error) {
                showFailed('Fout bij verificatie: ' + error.message);
            }
        }

        function showLoading() {
            verificationResult.className = 'verification-result show loading';
            resultIcon.textContent = '';
            resultIcon.innerHTML = '<div class="spinner"></div>';
            resultTitle.textContent = 'Bezig met verifiëren...';
            resultTitle.className = 'result-title info';
            resultDetails.innerHTML = '';
        }

        function showVerified(data) {
            verificationResult.className = 'verification-result show verified';
            resultIcon.textContent = '✅';
            resultTitle.textContent = 'Document is Geldig';
            resultTitle.className = 'result-title success';

            const detailsHtml = `
                <div class="details">
                    <div class="detail-row">
                        <span class="detail-label">Ondertekend door:</span>
                        <span class="detail-value">${data.signer.name}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Naam:</span>
                        <span class="detail-value">${data.signer.credentials.first_name} ${data.signer.credentials.last_name}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">BSN:</span>
                        <span class="detail-value">${data.signer.credentials.bsn}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Geboortedatum:</span>
                        <span class="detail-value">${data.signer.credentials.birth_date}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Document nummer:</span>
                        <span class="detail-value">${data.signer.credentials.document_number}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Ondertekend op:</span>
                        <span class="detail-value">${new Date(data.signedAt).toLocaleString('nl-NL')}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Origineel bestand:</span>
                        <span class="detail-value">${data.originalFileName}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Document hash:</span>
                        <span class="detail-value">
                            <div class="hash-display">${data.documentHash}</div>
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Document ID:</span>
                        <span class="detail-value">
                            <div class="hash-display">${data.documentId}</div>
                        </span>
                    </div>
                </div>
            `;

            resultDetails.innerHTML = detailsHtml;
        }

        function showFailed(errorMessage) {
            verificationResult.className = 'verification-result show failed';
            resultIcon.textContent = '❌';
            resultTitle.textContent = 'Verificatie Mislukt';
            resultTitle.className = 'result-title error';

            resultDetails.innerHTML = `
                <div class="details">
                    <div class="detail-row">
                        <span class="detail-label">Reden:</span>
                        <span class="detail-value">${errorMessage}</span>
                    </div>
                </div>
            `;
        }

        // QR Scanner button (placeholder - would need camera access in real implementation)
        document.getElementById('scanQrButton').addEventListener('click', () => {
            alert('QR scanner functionaliteit vereist camera toegang. Gebruik een QR scanner app op je mobiel om de verificatie URL te scannen.');
        });
    </script>
</body>
</html>
