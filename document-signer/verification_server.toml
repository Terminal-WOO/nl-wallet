# Document Signer Verification Server Configuration

# Logging
log_requests = true
structured_logging = false

# Ephemeral ID secret for QR code generation (64 hex characters = 32 bytes)
ephemeral_id_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# Trust anchors - CA certificates that sign reader (relying party) certificates
reader_trust_anchors = [""]

# Issuer trust anchors - for now we'll use the same CA
issuer_trust_anchors = [""]

# Server URLs
public_url = "http://localhost:8001/"
universal_link_base_url = "walletdebuginteraction://wallet.edi.rijksoverheid.nl/"

# Wallet client IDs
wallet_client_ids = ["https://wallet.edi.rijksoverheid.nl"]

# CORS - allow frontend
allow_origins = ["http://localhost:8080"]

# Public endpoint for wallet app (also serves as private endpoint when requester_server is absent)
[wallet_server]
ip = "127.0.0.1"
port = 8001

# Storage - use in-memory for development (no database needed)
[storage]
url = "memory://"

# Document signing use case
[usecases.document_signing]
private_key_type = "software"
private_key = "MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg24wiB7a+f0M1QDWu2ajLAkmChisBl6EOGeIWzv75EMShRANCAAQS2+9+JENzstCcctSiLjlzUZKhBU8ti84mMt8CAstbYAbfboDe2Hio2xnrb2cMtcbqGtQFipNUqcEnDQVY5B2V"
certificate = ""
